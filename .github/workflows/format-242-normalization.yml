name: Format 242 Normalization Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Print exact formatter delta
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace \
            src/ck_output_normalization.jl \
            src/ck_output_pairing.jl \
            src/ck_output_pairing_series.jl \
            src/ck_output_right_normalization.jl \
            test/ck_endpoint_physical_output_reference.jl \
            test/ck_output_normalization.jl
          git diff -- \
            src/ck_output_normalization.jl \
            src/ck_output_pairing.jl \
            src/ck_output_pairing_series.jl \
            src/ck_output_right_normalization.jl \
            test/ck_endpoint_physical_output_reference.jl \
            test/ck_output_normalization.jl
