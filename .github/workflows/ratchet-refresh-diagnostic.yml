name: Ratchet refresh diagnostic

on:
  push:
    branches:
      - diagnostic/122-ratchet-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Install pinned JETLS
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="6893fcef26708d64360c048e039102c76ad032c0")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Instantiate ratchet environment
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Refresh all baselines deliberately
        run: |
          julia --project=code_ratchet -e 'using CodeRatchet; try; @eval using JET; catch; end; exit(CodeRatchet.main())' all refresh --accept-change
      - name: Commit generated baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code_ratchet/*_baseline.toml
          git diff --cached --stat
          git commit -m 'ci: refresh ratchet baselines'
          git push origin HEAD:diagnostic/122-ratchet-refresh
