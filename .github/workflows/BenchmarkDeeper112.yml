name: Benchmark deeper cleanup on Julia 1.12

on:
  push:
    branches: ['tmp/deeper-benchmark-112']

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Run benchmark suite
        run: |
          cd benchmark
          julia --project --threads=1 --gcthreads=1 -e '
            using Pkg
            Pkg.develop(PackageSpec(path=joinpath(pwd(), "..")))
            Pkg.instantiate()
            include("runbenchmarks.jl")'
          cat benchmarks_output.json
