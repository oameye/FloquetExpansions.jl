name: Format 242 Pairing Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Print exact formatter delta
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace src/ck_output_pairing.jl test/ck_output_pairing.jl
          git diff -- src/ck_output_pairing.jl test/ck_output_pairing.jl
