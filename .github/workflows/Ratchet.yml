name: Ratchet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The gate itself lives in CodeRatchet.jl and is called, not copied. Which
  # metrics run is [metrics].run in code_ratchet/rulings.toml, so this file
  # never needs editing to add or drop one.
  ratchet:
    # Pin the reusable workflow and Julia reference runtime: a quality baseline
    # must not change underneath an unchanged tree.
    uses: oameye/CodeRatchet.jl/.github/workflows/ratchet.yml@90cc9753755fcbc1f898939347995cec1ca2f4eb
    with:
      julia-version: '1.13'
      install-jetls: true
      # Pinned to the release the lsp baseline is taken under. `release` is a
      # moving branch: leaving it unpinned changes diagnostics without a source
      # change. Bumping this and refreshing the baseline is one deliberate
      # commit, which is the point.
      jetls-rev: '6893fcef26708d64360c048e039102c76ad032c0'
      # jet is deliberately left out here, not dropped. JET.yml already gates
      # it at absolute zero, which is stronger than a ratchet while it holds,
      # and JET costs minutes. It stays in [metrics].run so `make ratchet`
      # covers everything locally.
      metrics: 'complexity,style,docs,boxes,lsp'
