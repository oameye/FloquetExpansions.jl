name: Ratchet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Temporary baseline-refresh run: isolate CodeRatchet's package-level JET
  # metric so the complete 16-file baseline is generated by the gate itself.
  # Restore the normal pinned metric set immediately after consuming it.
  ratchet:
    uses: oameye/CodeRatchet.jl/.github/workflows/ratchet.yml@90cc9753755fcbc1f898939347995cec1ca2f4eb
    with:
      julia-version: '1.12'
      install-jetls: false
      metrics: 'jet'
