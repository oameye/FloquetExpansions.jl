name: Ratchet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Temporary baseline-refresh run: isolate the syntax-only style metric so the
  # missing CP-era rows are measured without paying for JETLS. Restore the full
  # pinned gate immediately after consuming the refresh artifact.
  ratchet:
    uses: oameye/CodeRatchet.jl/.github/workflows/ratchet.yml@90cc9753755fcbc1f898939347995cec1ca2f4eb
    with:
      julia-version: '1.12'
      install-jetls: false
      metrics: 'style'
