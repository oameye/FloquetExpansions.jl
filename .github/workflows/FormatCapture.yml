name: Format Capture

on:
  pull_request:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Emit formatted source
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace src/gksl_coordinates.jl
          echo '---FORMATTED-SOURCE-BEGIN---'
          cat src/gksl_coordinates.jl
          echo '---FORMATTED-SOURCE-END---'
