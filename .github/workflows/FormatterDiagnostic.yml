name: Formatter Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'ci/130-periodic-jump-full-stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Capture formatter check
        run: |
          set +e
          ${HOME}/.julia/bin/jlfmt --check --verbose . > formatter-diagnostic.log 2>&1
          echo "exit_code=$?" >> formatter-diagnostic.log
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formatter-diagnostic.log
          git commit -m "ci: capture JuliaFormatter diagnostic" || exit 0
          git push origin HEAD:${{ github.head_ref }}
