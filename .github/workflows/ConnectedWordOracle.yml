name: Connected Word Oracle

on:
  push:
    branches:
      - ci/155-targeted-oracle

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run targeted connected-word oracle
        run: julia --project=. test/connected_word_log.jl
