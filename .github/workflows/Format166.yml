name: Format 166

on:
  push:
    branches:
      - ci/166-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/166-format
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Format files
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace src/bloch_connected_van_vleck.jl
          ${HOME}/.julia/bin/jlfmt --inplace test/bloch_connected_van_vleck.jl
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bloch_connected_van_vleck.jl test/bloch_connected_van_vleck.jl
          git diff --cached --quiet || git commit -m 'style: format connected Van Vleck source'
          git push origin HEAD:ci/166-format
