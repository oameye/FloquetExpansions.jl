name: Apply argument-count cleanup

on:
  push:
    branches:
      - refactor/code-health-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/code-health-cleanup
      - name: Apply source cleanup
        run: python .tmp/apply_argcount_cleanup.py
      - name: Commit source cleanup
        run: |
          rm .tmp/apply_argcount_cleanup.py
          rm .github/workflows/ApplyArgcountCleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: keep helper seams narrow'
          git push
