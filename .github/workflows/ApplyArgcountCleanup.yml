name: Apply argument-count cleanup

on:
  push:
    branches: ['refactor/code-health-cleanup']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/code-health-cleanup
      - name: Refine helper seams
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              assert count == 1, pattern
              return updated

          path = Path('src/completion_linear_algebra.jl')
          text = path.read_text()
          text = sub_once(
              text,
              r'''function swap_matrix_solve_rows!\(\n  lower::CompletionMatrix,\n  upper::CompletionMatrix,\n  permutation::Vector\{Int\},\n  k::Int,\n  pivot_row::Int,\n  n::Int,\n\)\n  k == pivot_row && return nothing\n  for column in 1:n''',
              '''function swap_matrix_solve_rows!(
  lower::CompletionMatrix,
  upper::CompletionMatrix,
  permutation::Vector{Int},
  k::Int,
  pivot_row::Int,
)
  k == pivot_row && return nothing
  for column in axes(upper, 2)''',
          )
          text = text.replace(
              'swap_matrix_solve_rows!(lower, upper, permutation, k, pivot_row, n)',
              'swap_matrix_solve_rows!(lower, upper, permutation, k, pivot_row)',
              1,
          )
          path.write_text(text)

          path = Path('src/spectral_completion.jl')
          text = path.read_text()
          text = sub_once(
              text,
              r'''function solve_spectral_branch_components!\(.*?\n  return vector\nend\n\nfunction spectral_normalization''',
              '''function solve_spectral_branch_components!(
  vector::Vector{CompletionScalar},
  residual::Vector{CompletionScalar},
  gaps::Vector{CompletionScalar},
  branch::Int,
  conditions::CompletionConditions,
)::Bool
  for index in eachindex(vector)
    index == branch && continue
    value = simplify_scalar(residual[index])
    gap = gaps[index]
    if structurally_zero(gap)
      structurally_zero(value) || return false
      continue
    end
    structurally_nonzero(gap, conditions) || require_regularity!(conditions, gap)
    vector[index] = simplify_scalar(value / gap)
  end
  return true
end

function spectral_normalization''',
          )
          text = sub_once(
              text,
              r'''    solve_spectral_branch_components!\(\n\s+vectors\[order \+ 1\], residual, gaps, branch, order, conditions\n\s+\)''',
              '''    resolved = solve_spectral_branch_components!(
      vectors[order + 1], residual, gaps, branch, conditions
    )
    resolved || throw(
      ArgumentError(
        "Spectral completion encountered unresolved mixing inside a degenerate leading sector at order $order",
      ),
    )''',
          )
          path.write_text(text)

          path = Path('src/gksl_coordinates.jl')
          text = path.read_text()
          text = sub_once(
              text,
              r'''function coefficient_pivot_row!\(.*?\nend\n\nfunction swap_coefficient_rows!''',
              '''function coefficient_pivot_row!(
  work::KossakowskiMatrix, pivot::CartesianIndex{2}
)::Int
  first_row, column = Tuple(pivot)
  for row in first_row:size(work, 1)
    value = simplify_coefficient(work[row, column])
    work[row, column] = value
    iszero(value) || return row
  end
  return 0
end

function swap_coefficient_rows!''',
          )
          text = sub_once(
              text,
              r'''function swap_coefficient_rows!\(.*?\nend\n\nfunction eliminate_coordinate_column!''',
              '''function swap_coefficient_rows!(matrix::KossakowskiMatrix, rows::NTuple{2,Int})
  first_row, second_row = rows
  first_row == second_row && return matrix
  for column in axes(matrix, 2)
    matrix[first_row, column], matrix[second_row, column] = matrix[second_row, column],
    matrix[first_row, column]
  end
  return matrix
end

function eliminate_coordinate_column!''',
          )
          text = sub_once(
              text,
              r'''function eliminate_coordinate_column!\(.*?\nend\n\nfunction coordinate_pivot_rows''',
              '''function eliminate_coordinate_column!(
  work::KossakowskiMatrix, pivot_index::CartesianIndex{2}
)
  pivot_row, column = Tuple(pivot_index)
  direction_count, monomial_count = size(work)
  pivot = work[pivot_row, column]
  for row in (pivot_row + 1):direction_count
    entry = simplify_coefficient(work[row, column])
    iszero(entry) && continue
    factor = simplify_coefficient(entry * inv(pivot))
    for trailing in column:monomial_count
      work[row, trailing] = simplify_coefficient(
        work[row, trailing] - factor * work[pivot_row, trailing]
      )
    end
  end
  return work
end

function coordinate_pivot_rows''',
          )
          text = sub_once(
              text,
              r'''    candidate = coefficient_pivot_row!\(work, pivot_row, direction_count, column\)\n    iszero\(candidate\) && continue\n    swap_coefficient_rows!\(work, pivot_row, candidate, 1:monomial_count\)\n    eliminate_coordinate_column!\(work, pivot_row, column, direction_count, monomial_count\)''',
              '''    pivot_index = CartesianIndex(pivot_row, column)
    candidate = coefficient_pivot_row!(work, pivot_index)
    iszero(candidate) && continue
    swap_coefficient_rows!(work, (pivot_row, candidate))
    eliminate_coordinate_column!(work, pivot_index)''',
          )
          text = sub_once(
              text,
              r'''function normalize_inverse_pivot_row!\(.*?\nend\n\nfunction eliminate_inverse_column!''',
              '''struct CoefficientInverseWorkspace
  left::KossakowskiMatrix
  right::KossakowskiMatrix
end

function normalize_inverse_pivot_row!(workspace::CoefficientInverseWorkspace, column::Int)
  left = workspace.left
  right = workspace.right
  pivot_inverse = inv(left[column, column])
  for trailing in axes(left, 2)
    left[column, trailing] = simplify_coefficient(left[column, trailing] * pivot_inverse)
    right[column, trailing] = simplify_coefficient(right[column, trailing] * pivot_inverse)
  end
  return nothing
end

function eliminate_inverse_column!''',
          )
          text = sub_once(
              text,
              r'''function eliminate_inverse_column!\(.*?\nend\n\nfunction inverse_coefficients''',
              '''function eliminate_inverse_column!(workspace::CoefficientInverseWorkspace, column::Int)
  left = workspace.left
  right = workspace.right
  for row in axes(left, 1)
    row == column && continue
    factor = simplify_coefficient(left[row, column])
    iszero(factor) && continue
    for trailing in axes(left, 2)
      left[row, trailing] = simplify_coefficient(
        left[row, trailing] - factor * left[column, trailing]
      )
      right[row, trailing] = simplify_coefficient(
        right[row, trailing] - factor * right[column, trailing]
      )
    end
  end
  return nothing
end

function inverse_coefficients''',
          )
          text = text.replace(
              '  right = coefficient_identity(n)\n\n  for column in 1:n',
              '  right = coefficient_identity(n)\n  workspace = CoefficientInverseWorkspace(left, right)\n\n  for column in 1:n',
              1,
          )
          text = text.replace(
              'candidate = coefficient_pivot_row!(left, column, n, column)',
              'candidate = coefficient_pivot_row!(left, CartesianIndex(column, column))',
              1,
          )
          text = text.replace(
              'swap_coefficient_rows!(left, column, candidate, 1:n)',
              'swap_coefficient_rows!(left, (column, candidate))',
              1,
          )
          text = text.replace(
              'swap_coefficient_rows!(right, column, candidate, 1:n)',
              'swap_coefficient_rows!(right, (column, candidate))',
              1,
          )
          text = text.replace(
              'normalize_inverse_pivot_row!(left, right, column, n)',
              'normalize_inverse_pivot_row!(workspace, column)',
              1,
          )
          text = text.replace(
              'eliminate_inverse_column!(left, right, column, n)',
              'eliminate_inverse_column!(workspace, column)',
              1,
          )
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/ApplyArgcountCleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/completion_linear_algebra.jl src/gksl_coordinates.jl src/spectral_completion.jl .github/workflows/ApplyArgcountCleanup.yml
          git commit -m 'refactor: keep helper seams narrow'
          git push
