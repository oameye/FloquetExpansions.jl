name: Periodic Jump Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  test:
    if: github.head_ref == 'ci/130-periodic-jump-full-stack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Capture periodic-jump RR test
        run: |
          set +e
          julia --project -e 'using Pkg; Pkg.test(test_args=["cp_hfe_periodic_jump_rr"])' > periodic-jump-diagnostic.log 2>&1
          echo "exit_code=$?" >> periodic-jump-diagnostic.log
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add periodic-jump-diagnostic.log
          git commit -m "ci: capture periodic-jump diagnostic" || exit 0
          git push origin HEAD:${{ github.head_ref }}
