name: Audit Julia 1.13 JET hardening

on:
  push:
    branches: ['tmp/julia13-jet-fix']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/julia13-jet-fix
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Apply compiler-hardening patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/completion_conversion.jl')
          text = p.read_text()
          pattern = r"  argument = Symbolics\.unwrap_const\(only\(arguments\)\)\n  rational = if argument isa Integer\n[\s\S]*?  end\n  rational > 1 \|\| return nothing"
          replacement = "  argument = Symbolics.unwrap_const(only(arguments))\n  rational = if argument isa Int\n    Rational{Int}(argument, 1)\n  elseif argument isa Rational{Int}\n    argument\n  else\n    return nothing\n  end\n  rational > 1 || return nothing"
          text, count = re.subn(pattern, replacement, text, count=1)
          assert count == 1, 'exact radical block changed'
          old = "  for (index, matrix) in enumerate(matrices)\n    grade = index - 1\n"
          new = "  for index in eachindex(matrices)\n    matrix = matrices[index]\n    grade = index - 1\n"
          assert text.count(old) == 1, 'physical-series enumerate block changed'
          p.write_text(text.replace(old, new))

          p = Path('src/gksl_coordinates.jl')
          text = p.read_text()
          anchor = '@inline liouvillian_iszero(value::Liouvillian)::Bool = iszero(value)::Bool\n'
          replacement = anchor + '@inline qadd_term_pairs(value::SQA.QAdd) = pairs(getfield(value, :arguments))\n'
          assert text.count(anchor) == 1, 'qadd helper anchor changed'
          text = text.replace(anchor, replacement)
          pattern = r"function canonical_liouvillian\(L::Liouvillian\)::Liouvillian\n[\s\S]*?\nend\n\n(?=function multiply_coefficients)"
          replacement = "function canonical_liouvillian(L::Liouvillian)::Liouvillian\n  result = zero(L)\n  for entry in term_pairs(L)\n    action = first(entry)\n    coefficient = last(entry)\n    left_canonical = canonical_qadd(first(action))\n    right_canonical = canonical_qadd(last(action))\n    for left_entry in qadd_term_pairs(left_canonical)\n      left_term = first(left_entry)\n      left_coefficient = last(left_entry)\n      for right_entry in qadd_term_pairs(right_canonical)\n        right_term = first(right_entry)\n        right_coefficient = last(right_entry)\n        product = coefficient * left_coefficient * right_coefficient\n        combined = simplify_coefficient(product)\n        iszero(combined) && continue\n        add_term!(result, monomial_operator(left_term), monomial_operator(right_term), combined)\n      end\n    end\n  end\n  return result\nend\n\n"
          text, count = re.subn(pattern, replacement, text, count=1)
          assert count == 1, 'canonical_liouvillian block changed'
          old = "  for (left, right, coefficient) in terms(canonical_liouvillian(L))\n    (qadd_isone(left) || qadd_isone(right)) && continue\n    left_term = first(first(left))\n"
          new = "  canonical = canonical_liouvillian(L)\n  for entry in term_pairs(canonical)\n    action = first(entry)\n    coefficient = last(entry)\n    left = first(action)\n    right = last(action)\n    (qadd_isone(left) || qadd_isone(right)) && continue\n    left_term = first(first(qadd_term_pairs(left)))\n"
          assert text.count(old) == 1, 'sandwich outer loop changed'
          text = text.replace(old, new)
          old = "    right_adjoint = canonical_qadd(adjoint(right))\n    for (right_term, right_coefficient) in right_adjoint\n      isempty(right_term.ops) && continue\n"
          new = "    right_adjoint = canonical_qadd(adjoint(right))\n    for right_entry in qadd_term_pairs(right_adjoint)\n      right_term = first(right_entry)\n      right_coefficient = last(right_entry)\n      isempty(right_term.ops) && continue\n"
          assert text.count(old) == 1, 'sandwich right loop changed'
          p.write_text(text.replace(old, new))
          PY
      - name: Install and apply formatter
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.add("JuliaFormatter")'
          julia -e 'using JuliaFormatter; format_file("src/completion_conversion.jl"); format_file("src/gksl_coordinates.jl")'
      - name: Set up JET environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run required JET optimizer suite
        run: julia --project=test test/quality/JET.jl
      - name: Commit successful source patch
        run: |
          rm .github/workflows/AuditJulia13JETFix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/completion_conversion.jl src/gksl_coordinates.jl .github/workflows/AuditJulia13JETFix.yml
          git diff --cached --quiet || git commit -m 'refactor: harden CP kernels for Julia 1.13 inference'
          git push
