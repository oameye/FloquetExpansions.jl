name: OpenLegTargetedCI

on:
  push:
    branches:
      - research/169-open-leg-targeted-ci

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - '1.10'
          - '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - run: julia test/open_leg_cp_hfe_reference.jl
