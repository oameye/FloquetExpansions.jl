name: Fix 57 CI

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/feat/completion-state-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/completion-state-provenance
      - run: python .github/scripts/fix57_ci.py
      - run: |
          if git diff --quiet -- src test; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine.jl src/liouvillian.jl test/liouvillian.jl
          git commit -m 'fix: address #57 CI regressions'
          git push origin HEAD:feat/completion-state-provenance
