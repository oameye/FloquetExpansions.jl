name: Fix 57 remaining

on:
  push:
    branches:
      - feat/completion-state-provenance
    paths:
      - .github/workflows/Fix57Remaining.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/completion-state-provenance
      - run: python .github/scripts/fix57_remaining.py
      - run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine.jl src/liouvillian.jl
          git commit -m 'fix: close remaining #57 CI gaps'
          git push origin HEAD:feat/completion-state-provenance
