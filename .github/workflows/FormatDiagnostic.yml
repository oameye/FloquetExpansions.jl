name: Format Diagnostic

on:
  push:
    branches:
      - ci/138-format-diagnostic

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Print formatter diff
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace benchmark/coherent_profile.jl
          git diff -- benchmark/coherent_profile.jl
