name: Validate deeper code-health cleanup

on:
  push:
    branches: ['tmp/code-health-deeper-cleanup']

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  jet:
    name: JET optimizer gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Set up test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run JET analysis
        run: julia --project=test test/quality/JET.jl

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Check formatting
        run: ${HOME}/.julia/bin/jlfmt --check --verbose .

  benchmark:
    name: Completion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run benchmarks
        run: |
          cd benchmark
          julia --project --threads=1 --gcthreads=1 --color=yes -e '
            using Pkg;
            Pkg.develop(PackageSpec(path=joinpath(pwd(), "..")));
            Pkg.instantiate();
            include("runbenchmarks.jl")'
      - name: Restore benchmark project
        if: ${{ always() }}
        run: git restore --worktree benchmark/Project.toml
      - name: Compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmark Results
          tool: julia
          output-file-path: benchmark/benchmarks_output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '130%'
          fail-threshold: '170%'
          comment-on-alert: false
          comment-always: false
          fail-on-alert: true
          benchmark-data-dir-path: benchmark
          max-items-in-chart: 100
          auto-push: false
