name: Format Scaling 159

on:
  push:
    branches: [ci/159-scaling-format]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/159-scaling-format
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - run: ${HOME}/.julia/bin/jlfmt --inplace benchmark/connected_van_vleck_scaling.jl
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark/connected_van_vleck_scaling.jl
          git diff --cached --quiet || git commit -m 'style: format connected scaling runner'
          git push origin HEAD:ci/159-scaling-format
