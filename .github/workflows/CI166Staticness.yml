name: CI166 Staticness

on:
  push:
    branches:
      - 'ci/166-staticness-work'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make Lyndon predicate total Boolean
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/bloch_connected_van_vleck.jl')
          text = path.read_text()
          old = '  return all(isless(word, word[index:end]) for index in 2:length(word))\n'
          new = '  return all(isless(word, word[index:end]) === true for index in 2:length(word))\n'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('Lyndon predicate anchor not found')
          PY
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Install JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Format source
        run: jlfmt --inplace src/bloch_connected_van_vleck.jl
      - name: Commit exact source patch
        run: |
          if git diff --quiet -- src/bloch_connected_van_vleck.jl; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bloch_connected_van_vleck.jl
          git commit -m 'fix: make Lyndon predicate total Boolean'
          git push origin HEAD:ci/166-staticness-work
      - name: Targeted regression
        run: julia --project=. -e 'using Pkg; Pkg.test(; test_args=["bloch_connected_van_vleck"])'
      - name: Instantiate CodeRatchet
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Report boxed captures
        run: julia --project=code_ratchet -e 'using CodeRatchet; exit(CodeRatchet.main())' boxes methods
