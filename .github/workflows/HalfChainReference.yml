name: Half-chain reference

on:
  pull_request:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - name: Run exact half-chain reference tests
        run: julia test/open_leg_halfchain_representation.jl
