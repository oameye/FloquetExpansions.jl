name: Connected Van Vleck Scaling

on:
  push:
    branches: [ci/159-high-order-scaling]

jobs:
  scaling:
    name: ${{ matrix.workload }} order ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        workload: [qubit, kerr]
        order: [4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/159-high-order-scaling
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - name: Instantiate benchmark environment
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run scaling benchmark
        run: julia --project=benchmark benchmark/connected_van_vleck_scaling.jl ${{ matrix.workload }} ${{ matrix.order }}
