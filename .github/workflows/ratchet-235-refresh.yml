name: Ratchet 235 Refresh Diagnostic

on:
  pull_request:
    branches:
      - feature/226-physical-kernel-algebra

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Instantiate ratchet environment
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Generate and print accepted baseline candidate
        run: |
          set +e
          julia --project=code_ratchet -e 'using CodeRatchet; try; @eval using JET; catch; end; exit(CodeRatchet.main())' all check
          set -e
          echo '=== complexity ==='
          cat code_ratchet/_refresh/complexity_baseline.toml
          echo '=== style ==='
          cat code_ratchet/_refresh/style_baseline.toml
          echo '=== docs ==='
          cat code_ratchet/_refresh/docs_baseline.toml
          echo '=== boxes ==='
          cat code_ratchet/_refresh/boxes_baseline.toml
          echo '=== lsp ==='
          cat code_ratchet/_refresh/lsp_baseline.toml
