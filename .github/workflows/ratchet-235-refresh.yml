name: Ratchet 235 Refresh Diagnostic

on:
  pull_request:
    branches:
      - feature/226-physical-kernel-algebra

permissions:
  contents: read

jobs:
  lsp-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Install pinned JETLS
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="6893fcef26708d64360c048e039102c76ad032c0")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Instantiate ratchet environment
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Print exact JETLS report
        run: julia --project=code_ratchet -e 'using CodeRatchet; println.(CodeRatchet.lsp_report())'
