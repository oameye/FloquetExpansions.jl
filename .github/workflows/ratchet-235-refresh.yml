name: Ratchet 235 Refresh Diagnostic

on:
  pull_request:
    branches:
      - feature/226-physical-kernel-algebra

permissions:
  actions: read
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing ratchet refresh artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35470142056 -R oameye/FloquetExpansions.jl -n coderatchet-refresh -D refresh
      - name: Print exact generated baselines
        run: |
          echo '=== complexity ==='
          cat refresh/complexity_baseline.toml
          echo '=== style ==='
          cat refresh/style_baseline.toml
          echo '=== docs ==='
          cat refresh/docs_baseline.toml
          echo '=== boxes ==='
          cat refresh/boxes_baseline.toml
          echo '=== lsp ==='
          cat refresh/lsp_baseline.toml
