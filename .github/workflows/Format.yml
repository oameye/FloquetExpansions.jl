name: Format

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Show formatting diff
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace .
          git diff -- examples/cp_completion.jl src/FloquetExpansions.jl src/engine.jl src/gksl_coordinates.jl test/runtests.jl
          git diff --exit-code
