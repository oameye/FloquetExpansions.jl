name: Format

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@7
      - uses: julia-actions/setup-julia@3
      - uses: julia-actions/cache@3
      - name: Install JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Check formatting
        run: |
          ${HOME}/.julia/bin/jlfmt --check --verbose .