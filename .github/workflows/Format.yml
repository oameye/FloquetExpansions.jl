name: Format

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - name: Install JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Show exact research formatting diff
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace --verbose test/bloch_feshbach_reference.jl
          ${HOME}/.julia/bin/jlfmt --inplace --verbose test/helpers/bloch_feshbach_reference.jl
          git diff -- test/bloch_feshbach_reference.jl test/helpers/bloch_feshbach_reference.jl
          git diff --exit-code -- test/bloch_feshbach_reference.jl test/helpers/bloch_feshbach_reference.jl
