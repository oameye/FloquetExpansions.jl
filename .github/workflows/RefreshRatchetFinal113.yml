name: Refresh final ratchet baselines on Julia 1.13

on:
  push:
    branches: ['tmp/ratchet-final-refresh-113']

permissions:
  actions: write
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/ratchet-final-refresh-113
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Install pinned JETLS
        run: >-
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="6893fcef26708d64360c048e039102c76ad032c0")'
      - name: Instantiate ratchet environment
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Refresh all configured baselines
        run: |
          export PATH="$HOME/.julia/bin:$PATH"
          julia --project=code_ratchet -e 'using JET, CodeRatchet; exit(CodeRatchet.main())' all refresh
      - name: Verify candidates and LSP report
        run: |
          export PATH="$HOME/.julia/bin:$PATH"
          julia --project=code_ratchet -e 'using CodeRatchet; exit(CodeRatchet.main())' complexity candidates
          julia --project=code_ratchet -e 'using CodeRatchet; exit(CodeRatchet.main())' lsp report
          julia --project=code_ratchet -e 'using JET, CodeRatchet; exit(CodeRatchet.main())' all scorecard
      - name: Commit generated baselines and remove one-shot workflow
        run: |
          rm .github/workflows/RefreshRatchetFinal113.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code_ratchet/*_baseline.toml .github/workflows/RefreshRatchetFinal113.yml
          git diff --cached --quiet || git commit -m 'ci: refresh final CodeRatchet baselines on Julia 1.13'
          git push
