name: Diagnose 305 LSP

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Install JETLS
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="6893fcef26708d64360c048e039102c76ad032c0")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Instantiate ratchet environment
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Report exact diagnostics
        run: julia --project=code_ratchet -e 'using CodeRatchet; exit(CodeRatchet.main(["lsp", "report"]))'
