name: CK276 Format Apply

on:
  push:
    branches:
      - 'ci/276-order6-diagnostic'
    paths:
      - '.github/workflows/FormatApply.yml'

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/276-order6-diagnostic
      - uses: julia-actions/setup-julia@v3
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Apply formatter and commit target files
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace test/ck_one_dissipator_channel_gauge.jl test/ck_one_dissipator_order6_diagnostic.jl
          if git diff --quiet -- test/ck_one_dissipator_channel_gauge.jl test/ck_one_dissipator_order6_diagnostic.jl; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/ck_one_dissipator_channel_gauge.jl test/ck_one_dissipator_order6_diagnostic.jl
          git commit -m 'style: format #276 tests'
          git push origin HEAD:ci/276-order6-diagnostic
