name: Validate 60

on:
  push:
    branches:
      - feat/recursive-gram-onsets

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/recursive-gram-onsets
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Format recursive Gram changes
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
          ${HOME}/.julia/bin/jlfmt --inplace src/gram_recursion.jl src/FloquetExpansions.jl
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/gram_recursion.jl src/FloquetExpansions.jl
          if ! git diff --cached --quiet; then
            git commit -m 'style: format recursive Gram completion'
            git push origin HEAD:feat/recursive-gram-onsets
          fi
      - name: Run package tests
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Set up JET environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run JET analysis
        run: julia --project=test test/quality/JET.jl
