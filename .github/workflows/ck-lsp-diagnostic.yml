name: CK LSP Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  lsp-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Install JETLS
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="6893fcef26708d64360c048e039102c76ad032c0")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Instantiate ratchet environment
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Print undismissed JETLS diagnostics
        run: julia --project=code_ratchet -e 'using CodeRatchet; foreach(println, CodeRatchet.lsp_report())'
