name: Validate 59

on:
  push:

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/gram-cp-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/gram-cp-completion
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Format #59 changes
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
          ${HOME}/.julia/bin/jlfmt --inplace src/FloquetExpansions.jl src/gram_completion.jl test/gram_completion.jl
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/FloquetExpansions.jl src/gram_completion.jl test/gram_completion.jl
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Gram completion'
            git push origin HEAD:feat/gram-cp-completion
          fi
      - name: Run package tests
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Set up JET environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run JET analysis
        run: julia --project=test test/quality/JET.jl
      - name: Build documentation without deployment
        env:
          CI: 'false'
        run: |
          julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
          julia --project=docs docs/make.jl
