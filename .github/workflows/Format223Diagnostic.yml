name: Format 223 diagnostic

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Show exact formatter delta
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace test/bloch_order_recurrence.jl test/quality/JET.jl
          git diff -- test/bloch_order_recurrence.jl test/quality/JET.jl
          test -z "$(git status --porcelain -- test/bloch_order_recurrence.jl test/quality/JET.jl)"
