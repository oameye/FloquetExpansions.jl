name: Apply matrix product accumulator experiment

on:
  push:
    branches: ['tmp/matrix-product-accumulator']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/matrix-product-accumulator
      - name: Apply source experiment
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/matrix_series.jl')
          s = p.read_text()
          old = (
              'function series_mul(a::MatrixSeries, b::MatrixSeries, N::Int)\n'
              '  validate_series_order(N)\n'
              '  m, k_a = validate_matrix_series(a)\n'
              '  k_b, p = validate_matrix_series(b)\n'
              '  k_a == k_b || throw(DimensionMismatch("matrix-series inner dimensions must match"))\n'
              '  result = Vector{CompletionMatrix}(undef, N + 1)\n'
              '  for n in 0:N\n'
              '    coefficient = completion_matrix_zeros(m, p)\n'
              '    for k in 0:n\n'
              '      if k + 1 <= length(a) && n - k + 1 <= length(b)\n'
              '        coefficient += a[k + 1] * b[n - k + 1]\n'
              '      end\n'
              '    end\n'
              '    result[n + 1] = coefficient\n'
              '  end\n'
              '  return result\n'
              'end\n'
          )
          new = (
              'function matrix_product_dimensions(\n'
              '  target::CompletionMatrix, left::CompletionMatrix, right::CompletionMatrix\n'
              ')\n'
              '  rows, inner = size(left)\n'
              '  right_inner, columns = size(right)\n'
              '  inner == right_inner || throw(DimensionMismatch("matrix product inner dimensions must match"))\n'
              '  size(target) == (rows, columns) ||\n'
              '    throw(DimensionMismatch("matrix product target has incompatible dimensions"))\n'
              '  return rows, inner, columns\n'
              'end\n\n'
              'function add_matrix_product!(\n'
              '  target::CompletionMatrix, left::CompletionMatrix, right::CompletionMatrix\n'
              ')\n'
              '  rows, inner, columns = matrix_product_dimensions(target, left, right)\n'
              '  for column in 1:columns, row in 1:rows\n'
              '    product = completion_zero()\n'
              '    for index in 1:inner\n'
              '      product += left[row, index] * right[index, column]\n'
              '    end\n'
              '    target[row, column] += product\n'
              '  end\n'
              '  return target\n'
              'end\n\n'
              'function subtract_matrix_product!(\n'
              '  target::CompletionMatrix, left::CompletionMatrix, right::CompletionMatrix\n'
              ')\n'
              '  rows, inner, columns = matrix_product_dimensions(target, left, right)\n'
              '  for column in 1:columns, row in 1:rows\n'
              '    product = completion_zero()\n'
              '    for index in 1:inner\n'
              '      product += left[row, index] * right[index, column]\n'
              '    end\n'
              '    target[row, column] -= product\n'
              '  end\n'
              '  return target\n'
              'end\n\n'
              'function series_mul(a::MatrixSeries, b::MatrixSeries, N::Int)\n'
              '  validate_series_order(N)\n'
              '  m, k_a = validate_matrix_series(a)\n'
              '  k_b, p = validate_matrix_series(b)\n'
              '  k_a == k_b || throw(DimensionMismatch("matrix-series inner dimensions must match"))\n'
              '  result = Vector{CompletionMatrix}(undef, N + 1)\n'
              '  for n in 0:N\n'
              '    coefficient = completion_matrix_zeros(m, p)\n'
              '    for k in 0:n\n'
              '      if k + 1 <= length(a) && n - k + 1 <= length(b)\n'
              '        add_matrix_product!(coefficient, a[k + 1], b[n - k + 1])\n'
              '      end\n'
              '    end\n'
              '    result[n + 1] = coefficient\n'
              '  end\n'
              '  return result\n'
              'end\n'
          )
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('src/completion_linear_algebra.jl')
          s = p.read_text()
          old1 = '      rhs -= A[k + 1] * result[order - k + 1]\n'
          new1 = '      subtract_matrix_product!(rhs, A[k + 1], result[order - k + 1])\n'
          old2 = '      rhs -= L[k + 1] * result[order - k + 1]\n'
          new2 = '      subtract_matrix_product!(rhs, L[k + 1], result[order - k + 1])\n'
          assert s.count(old1) == 1
          assert s.count(old2) == 1
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
      - name: Commit source-only candidate
        run: |
          rm .github/workflows/ApplyMatrixAccumulator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/matrix_series.jl src/completion_linear_algebra.jl .github/workflows/ApplyMatrixAccumulator.yml
          git diff --cached --quiet || git commit -m 'perf: accumulate symbolic matrix products in place'
          git push
