name: Apply deeper code-health cleanup

on:
  push:
    branches: ['tmp/code-health-deeper-cleanup']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/code-health-deeper-cleanup
      - name: Apply focused source transformation
        run: python .tmp/apply_deeper_cleanup.py
      - name: Commit source-only candidate
        run: |
          rm .tmp/apply_deeper_cleanup.py .github/workflows/ApplyDeeperCleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gksl_coordinates.jl src/completion_frame.jl src/matrix_series.jl .tmp/apply_deeper_cleanup.py .github/workflows/ApplyDeeperCleanup.yml
          git commit -m 'refactor: reduce repeated symbolic canonicalization'
          git push
