name: Format matrix accumulator final candidate

on:
  push:
    branches: ['tmp/matrix-product-final-formatted']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/matrix-product-final-formatted
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.0'
      - name: Format source
        run: julia -e 'using Pkg; Pkg.add("JuliaFormatter"); using JuliaFormatter; format("src/matrix_series.jl"); format("src/completion_linear_algebra.jl")'
      - name: Commit formatted source and remove scaffold
        run: |
          rm .github/workflows/FormatMatrixProductFinal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/matrix_series.jl src/completion_linear_algebra.jl .github/workflows/FormatMatrixProductFinal.yml
          git diff --cached --quiet || git commit -m 'style: format matrix accumulator candidate'
          git push
