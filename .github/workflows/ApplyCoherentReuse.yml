name: Apply coherent GKSL reuse candidate

on:
  push:
    branches: ['tmp/deeper-coherent-reuse-impl']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/deeper-coherent-reuse-impl
      - name: Apply retained GKSL data reuse
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/completion_frame.jl')
          s = p.read_text()
          old = (
              "function raw_kossakowski_series(expansion::FloquetExpansion, frame::DissipativeFrame)\n"
              "  components = getfield(expansion, :effective_components)\n"
              "  result = KossakowskiMatrix[]\n"
              "  sizehint!(result, length(components))\n"
              "  for component in components\n"
              "    push!(result, kossakowski(component, frame))\n"
              "  end\n"
              "  return result\n"
              "end\n"
          )
          new = (
              "struct RetainedGKSLData\n"
              "  hamiltonians::Vector{SQA.QAdd}\n"
              "  kossakowski::Vector{KossakowskiMatrix}\n"
              "end\n\n"
              "function retained_gksl_data(expansion::FloquetExpansion, frame::DissipativeFrame)\n"
              "  components = getfield(expansion, :effective_components)\n"
              "  hamiltonians = SQA.QAdd[]\n"
              "  matrices = KossakowskiMatrix[]\n"
              "  sizehint!(hamiltonians, length(components))\n"
              "  sizehint!(matrices, length(components))\n"
              "  for component in components\n"
              "    hamiltonian, matrix = extract_gksl(component, frame)\n"
              "    push!(hamiltonians, hamiltonian)\n"
              "    push!(matrices, matrix)\n"
              "  end\n"
              "  return RetainedGKSLData(hamiltonians, matrices)\n"
              "end\n\n"
              "function physical_retained_hamiltonian(\n"
              "  hamiltonians::Vector{SQA.QAdd}, wd::Symbolics.Num\n"
              ")::SQA.QAdd\n"
              "  coherent = zero(SQA.QAdd)\n"
              "  for index in eachindex(hamiltonians)\n"
              "    grade = index - 1\n"
              "    coherent = (coherent + reattach(hamiltonians[index], wd, grade))::SQA.QAdd\n"
              "  end\n"
              "  return SQA.simplify(coherent)::SQA.QAdd\n"
              "end\n"
          )
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('src/gram_recursion.jl')
          s = p.read_text()
          old = "  raw_matrices = raw_kossakowski_series(expansion, frame)\n  series = completion_series(raw_matrices)\n"
          new = "  retained = retained_gksl_data(expansion, frame)\n  series = completion_series(retained.kossakowski)\n"
          assert old in s
          s = s.replace(old, new).replace('    raw_matrices,\n', '    retained,\n')
          p.write_text(s)

          p = Path('src/spectral_completion.jl')
          s = p.read_text()
          assert old in s
          s = s.replace(old, new).replace('    raw_matrices,\n', '    retained,\n')
          p.write_text(s)

          p = Path('src/completion.jl')
          s = p.read_text()
          old_arg = '  raw_matrices::Vector{KossakowskiMatrix},\n'
          assert old_arg in s
          s = s.replace(old_arg, '  retained::RetainedGKSLData,\n')
          old_body = (
              '  retained_kossakowski = physical_kossakowski_series(raw_matrices, drive_frequency)\n'
              '  raw_generator = effective_generator(expansion)\n'
              '  coherent = hamiltonian(raw_generator, frame)\n'
          )
          new_body = (
              '  retained_kossakowski = physical_kossakowski_series(\n'
              '    retained.kossakowski, drive_frequency\n'
              '  )\n'
              '  coherent = physical_retained_hamiltonian(retained.hamiltonians, drive_frequency)\n'
          )
          assert old_body in s
          p.write_text(s.replace(old_body, new_body))
          PY
      - name: Commit source-only candidate
        run: |
          rm .github/workflows/ApplyCoherentReuse.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/completion_frame.jl src/gram_recursion.jl src/spectral_completion.jl src/completion.jl .github/workflows/ApplyCoherentReuse.yml
          git diff --cached --quiet || git commit -m 'refactor: reuse retained GKSL decomposition'
          git push
