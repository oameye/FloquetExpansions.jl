name: LSP diagnostic

on:
  push:
    branches:
      - diagnostic/122-lsp-report

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Install pinned JETLS
        run: |
          julia -e 'using Pkg; Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="6893fcef26708d64360c048e039102c76ad032c0")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Instantiate CodeRatchet
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Print reviewed LSP diagnostics
        run: julia --project=code_ratchet -e 'using CodeRatchet; foreach(println, CodeRatchet.lsp_report())'
