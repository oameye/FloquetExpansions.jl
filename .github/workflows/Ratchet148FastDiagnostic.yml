name: Ratchet 148 Fast Diagnostic

on:
  push:
    branches:
      - ci/148-ratchet-fast-diagnostic

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Instantiate ratchet environment
        run: julia --project=code_ratchet -e 'using Pkg; Pkg.instantiate()'
      - name: Refresh non-LSP baselines
        run: |
          for metric in complexity style docs boxes; do
            julia --project=code_ratchet -e 'using CodeRatchet; try; @eval using JET; catch; end; exit(CodeRatchet.main())' "$metric" refresh --accept-change
          done
      - name: Commit generated baselines
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add code_ratchet/complexity_baseline.toml code_ratchet/style_baseline.toml code_ratchet/docs_baseline.toml code_ratchet/boxes_baseline.toml
          git commit -m 'ci: materialize #148 ratchet baselines' || exit 0
          git push
