name: Rotating CK channel bridge diagnostic

on:
  pull_request:
    paths:
      - "test/ck_physical_kernel_sideband_obstruction.jl"
      - "test/ck_periodic_bernoulli_kernel_reference.jl"
      - "test/helpers/bloch_order_kernel_reference.jl"
      - "test/ck_physical_b2_kernel_bridge.jl"
      - "test/ck_rotating_jump_bloch_channel_bridge.jl"
      - ".github/workflows/rotating-ck-channel-bridge-diagnostic.yml"

jobs:
  reference:
    strategy:
      matrix:
        julia-version: ["1.10", "1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Run rotating CK channel bridge
        run: julia test/ck_rotating_jump_bloch_channel_bridge.jl

  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Show formatter diff
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace test/ck_rotating_jump_bloch_channel_bridge.jl
          git diff -- test/ck_rotating_jump_bloch_channel_bridge.jl
