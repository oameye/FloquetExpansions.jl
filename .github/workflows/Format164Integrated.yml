name: Format 164 Integrated

on:
  push:
    branches:
      - ci/164-integrated-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/164-integrated-format
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Format integrated research files
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace \
            test/static_sector_exponential.jl \
            test/helpers/static_sector_exponential.jl \
            test/helpers/connected_van_vleck_reconstruction.jl \
            benchmark/connected_van_vleck_reconstruction.jl \
            benchmark/connected_van_vleck_scaling.jl
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/static_sector_exponential.jl test/helpers/static_sector_exponential.jl test/helpers/connected_van_vleck_reconstruction.jl benchmark/connected_van_vleck_reconstruction.jl benchmark/connected_van_vleck_scaling.jl
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format integrated static-sector experiment"
            git push origin HEAD:ci/164-integrated-format
          fi
