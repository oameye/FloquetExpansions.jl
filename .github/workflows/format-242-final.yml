name: Format 242 Final Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Print exact formatter delta
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace test/ck_mixed_qr_production_reference.jl
          git diff -- test/ck_mixed_qr_production_reference.jl
