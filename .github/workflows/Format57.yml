name: Format 57

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/completion-state-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/completion-state-provenance
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/engine.jl": [
                  ("_floquet_expansion_channels", "floquet_expansion_channels"),
                  ("_floquet_expansion", "floquet_expansion_impl"),
                  ("_require_hermitian_drive", "require_hermitian_drive"),
                  ("_microscopic_provenance", "microscopic_provenance"),
                  ("_liouvillian_from_provenance", "liouvillian_from_provenance"),
              ],
              "src/liouvillian.jl": [
                  ("_microscopic_provenance", "microscopic_provenance"),
                  ("_liouvillian_from_provenance", "liouvillian_from_provenance"),
                  ("_channel_liouvillian", "channel_liouvillian"),
                  ("_known_numeric_jump_rate", "known_numeric_jump_rate"),
                  ("_validated_jump_rate", "validated_jump_rate"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)

          path = Path("src/liouvillian.jl")
          text = path.read_text()
          fallback = '''function channel_liouvillian(::Any)\n  return throw(\n    ArgumentError("channels must contain only `collapse(...)` and `jump(...)` values")\n  )\nend\n\n'''
          if fallback not in text:
              raise SystemExit("expected channel fallback not found")
          text = text.replace(fallback, "")
          old_loop = '''  for channel in channels\n    generator = generator + channel_liouvillian(channel)\n  end\n'''
          new_loop = '''  for channel in channels\n    channel isa LiouvillianChannel || throw(\n      ArgumentError("channels must contain only `collapse(...)` and `jump(...)` values")\n    )\n    generator = generator + channel_liouvillian(channel)\n  end\n'''
          if old_loop not in text:
              raise SystemExit("expected channel loop not found")
          path.write_text(text.replace(old_loop, new_loop))
          PY

          ${HOME}/.julia/bin/jlfmt --inplace src/completion.jl src/engine.jl src/liouvillian.jl
          if git diff --quiet -- src/completion.jl src/engine.jl src/liouvillian.jl; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/completion.jl src/engine.jl src/liouvillian.jl
          git commit -m 'refactor: clean #57 internal helper names'
          git push origin HEAD:feat/completion-state-provenance
