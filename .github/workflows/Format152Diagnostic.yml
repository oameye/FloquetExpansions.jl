name: Format 152 Diagnostic

on:
  push:
    branches:
      - ci/152-format-diagnostic

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Show exact formatter diff
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace src/bloch_van_vleck.jl test/bloch_van_vleck_internal.jl
          git diff -- src/bloch_van_vleck.jl test/bloch_van_vleck_internal.jl
