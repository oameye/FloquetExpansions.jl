name: CK Normalization Targeted

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Run CK normalization tests
        run: |
          julia --project test/ck_output_normalization.jl
          julia --project test/ck_rotating_jump_normalization.jl
