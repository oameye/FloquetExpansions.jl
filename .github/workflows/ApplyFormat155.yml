name: Apply Format 155

on:
  push:
    branches:
      - ci/155-format-apply

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/155-format-apply
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Format research files
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace test/helpers/connected_word_log.jl test/connected_word_log.jl
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/helpers/connected_word_log.jl test/connected_word_log.jl
          git commit -m "style: apply JuliaFormatter to connected-word prototype"
          git push origin HEAD:ci/155-format-apply
