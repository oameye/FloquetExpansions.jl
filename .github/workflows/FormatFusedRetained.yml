name: Format fused retained candidate

on:
  push:
    branches: [tmp/fused-retained-gksl]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/fused-retained-gksl
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.0'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Format source
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'style: format fused retained candidate'
            git push origin HEAD:tmp/fused-retained-gksl
          fi
