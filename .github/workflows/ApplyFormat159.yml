name: Apply Format 159
on:
  push:
    branches: [ci/159-format-apply]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/159-format-apply
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - run: ${HOME}/.julia/bin/jlfmt --verbose benchmark/connected_van_vleck_reconstruction.jl benchmark/lyndon_log_evaluation.jl test/connected_van_vleck_reconstruction.jl test/lyndon_log_evaluation.jl test/helpers/connected_van_vleck_reconstruction.jl
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark/connected_van_vleck_reconstruction.jl benchmark/lyndon_log_evaluation.jl test/connected_van_vleck_reconstruction.jl test/lyndon_log_evaluation.jl test/helpers/connected_van_vleck_reconstruction.jl
          git diff --cached --quiet || git commit -m 'style: format connected canonical prototype'
          git push origin HEAD:ci/159-format-apply
