name: CP-HFE Format Diagnostic

on:
  push:
    branches:
      - perf/100-cp-hfe-reconstruction
    paths:
      - benchmark/cp_hfe.jl
      - .github/workflows/format-cp-hfe-diagnostic.yml

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.Apps.add(name="JuliaFormatter")'
      - name: Print exact formatter diff
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace benchmark/cp_hfe.jl
          git diff -- benchmark/cp_hfe.jl
