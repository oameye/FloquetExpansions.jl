name: Validate retained GKSL reuse

on:
  push:
    branches: ['tmp/validate-retained-gksl']

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.13.0']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use current test harness
        run: |
          git fetch origin main
          git show origin/main:test/Project.toml > test/Project.toml
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  jet:
    name: JET optimizer gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use current JET harness
        run: |
          git fetch origin main
          git show origin/main:test/Project.toml > test/Project.toml
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.0'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Set up test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Check retained data concreteness
        run: |
          julia --project=test -e '
            using FloquetExpansions
            T = FloquetExpansions.RetainedGKSLData
            @assert isconcretetype(T)
            @assert all(isconcretetype, fieldtypes(T))
            @show fieldtypes(T)'
      - name: Run JET analysis
        run: julia --project=test test/quality/JET.jl

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.0'
      - name: Install JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Check formatting
        run: ${HOME}/.julia/bin/jlfmt --check --verbose src
