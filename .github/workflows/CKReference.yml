name: CK graded reference

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/CKReference.yml'
      - 'src/**'
      - 'test/ck_graded_bloch_projection.jl'
      - 'test/helpers/ck_graded_output_algebra.jl'
      - 'Project.toml'

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - run: julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter")'
      - name: Show formatter diff
        run: |
          ${HOME}/.julia/bin/jlfmt --inplace test/ck_graded_bloch_projection.jl test/helpers/ck_graded_output_algebra.jl
          git diff -- test/ck_graded_bloch_projection.jl test/helpers/ck_graded_output_algebra.jl
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=. test/ck_graded_bloch_projection.jl
